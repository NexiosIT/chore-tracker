      domains: []
  - id: STD-032
    name: Comment Discipline
    category: general
    path: standards/general/STD-032-comment-discipline.md
    description: Code must be self-explanatory — a comment only carries what code cannot express (domain constraint, non-obvious why, invariant). No spec/standard/process references, no narration, no ceremony doc-comments, no facts owned by other artifacts. Traceability lives in the Traceability Matrix and trace.yml, compliance in the checkpoint results — never in code
    status: active
    version: 1.1.0
    discovery_layer: manual
    injection: workflow
    last_reviewed: '2026-07-26'
    applies_to:
      service_types: []
      domains: []
  - id: STD-035
    name: Scenario-Key Test Binding
    category: general
    path: standards/general/STD-035-scenario-key-binding.md
    description: Every scenario-verifying test carries the scenario's derived key ({UC-id}#{12-hex}, from `ie spec scenarios`) in its test name so JUnit XML results bind to spec scenarios deterministically — `ie scenarios coverage` joins results against live-derived keys, replacing keyword heuristics and agent self-attestation. Also pins the project-owned E2E runner contract (a single-app suite co-located with its app, a cross-app suite in the hub's journey repo; `test:e2e`, JUnit XML to e2e-results/, advisory in CI) and journey discipline (no mock at a boundary, drive the user's surface, public-surface assertions only, more than one engine, green at birth and never retried). Stale keys surface as re-point signals; advisory at P1
    status: active
    version: 1.2.0
    discovery_layer: manual
    last_reviewed: '2026-07-26'
    applies_to:
      service_types: []
      domains: []
