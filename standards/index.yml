    category: general
    path: standards/general/STD-023-human-readable-output.md
    description: 'Human-facing agent output (review findings, checkpoint summaries, status, error and log strings, contract and README prose) must be understandable cold — plain language, expand a coded term on first use, never invent ad-hoc code schemes, one locator line, and one reading per sentence (ASD-STE100 structural rules: active voice, one instruction per sentence, 20/25-word cap, no phrasal verbs, no semicolons, hedges kept). Output-readability discipline, enforced via injection: workflow like STD-014/015/016.'
