# =============================================================================
# Standards Index
# =============================================================================
# Master index of all standards in the product-hub.
# Each entry maps a standard to its category, path, and applicability rules.
# Used by `ie manifest assemble` to select standards for agent context.
# Schema: @rp-flow/ie-core/schemas/standards-index.schema.json
#
# Phase 4 matching algorithm:
#   1. Determine target service type AND framework from the service registry
#   2. Filter standards where status = "active"
#   3. Drop standards with injection = "workflow" — they are enforced by a
#      workflow template (e.g. /ie/generate), not injected as context.
#   4. Domain gate: drop standards whose applies_to.domains is non-empty and
#      shares no domain with the generation's touched spec domains.
#   5. For stack-coupled standards (path under standards/{framework}/ where the
#      directory is not 'general' / 'api' / 'nfr'): include only when the
#      touched service's `framework` field matches the directory name.
#   6. For stack-agnostic standards (path under standards/general|api|nfr/):
#      filter where applies_to.service_types is empty OR contains target type.
#   7. Include matched standards in the agent context package as enriched
#      entries ({id, name, category, path}) — see manifest.schema.json.
#
# Note: applies_to.domains scopes a standard to specific spec domains.
# Empty ([]) = applies to all domains (the default — leave it as [] unless you
# have a reason to narrow). A non-empty list selects the standard only for
# generations that touch one of those domains. Domain names are the
# specs/{domain}/ directory names; combined with service_types/framework via AND.
#
# Evolution:
#   - discovery_layer tracks how the standard was introduced
#   - last_reviewed tracks when a human last reviewed the standard
#   - Layer 1 (CI) may add entries with status "draft" and discovery_layer "ci-detected"
#   - Layer 2 (Guardian review) promotes or deprecates standards
# =============================================================================

