id: UC-015
name: reactivate-member
slug: reactivate-member
domain: family
service: chore-tracker-api
actor: Parent
goal: As a parent, I want to reactivate a deactivated family member, so that they can use the family space again with their history intact.
preconditions:
  - The caller is logged in as an active parent.
  - The target member is deactivated.
postconditions:
  - The member's status is active.
  - The member can log in again with their existing password.
  - Sessions ended by the deactivation stay ended.
status: draft
version: 1.0.0
priority: P1
related_screens:
  - SCR-006
related_specs:
  - UC-003
  - UC-013
  - UC-014
dependencies:
  calls: []
  called_by: []
spec_hash: ''
contract_hashes: {}
endpoint: POST /api/members/{memberId}/reactivate
entities:
  - family-member
