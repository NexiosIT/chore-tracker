id: UC-009
name: reject-registration
slug: reject-registration
domain: family
service: chore-tracker-api
actor: Parent
goal: As a parent, I want to reject a kid's pending registration, so that only my own kids can join the family.
preconditions:
  - The caller is logged in as an active parent.
  - The registration exists and is pending.
postconditions:
  - The registration is marked rejected, is kept on record, and is no longer in the pending list.
  - The registration's username is freed, so a new registration or member can use it.
  - No family member is created.
  - The registration records the deciding parent and the decision time.
status: draft
version: 1.0.0
priority: P1
related_screens:
  - SCR-005
related_specs:
  - UC-006
  - UC-007
  - UC-008
  - UC-003
dependencies:
  calls: []
  called_by: []
spec_hash: ''
contract_hashes: {}
endpoint: POST /api/registrations/{registrationId}/reject
entities:
  - registration
