id: UC-004
name: log-out
slug: log-out
domain: family
service: chore-tracker-api
actor: Logged-in family member (parent or kid)
goal: As a logged-in family member, I want to log out on this device, so that nobody else can use my account on it.
preconditions:
  - The caller sends the token of a session that has not ended.
postconditions:
  - The session used for the call has ended and its token is no longer accepted.
  - The member's sessions on other devices are unaffected.
  - Each ended session is removed and a session end record is written with the member, the session's start time, the end time and reason logout.
status: draft
version: 1.0.0
priority: P1
related_screens:
  - SCR-004
related_specs:
  - UC-003
dependencies:
  calls: []
  called_by: []
spec_hash: ''
contract_hashes: {}
endpoint: DELETE /api/sessions/current
entities:
  - session
  - session-end-record
